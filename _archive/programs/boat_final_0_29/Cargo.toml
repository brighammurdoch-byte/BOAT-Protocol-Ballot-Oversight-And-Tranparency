[package]
name = "boat_final"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "boat_final"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["associated_token"] }
winnow = "=0.5.40"
toml_datetime = "=0.6.6"
blake3 = "=1.5.0"
ahash = "=0.8.4"
getrandom = { version = "=0.2.10", features = ["custom"] }
getrandom_old = { package = "getrandom", version = "0.1.16", features = ["dummy"] }
wasm-bindgen = "=0.2.87"
js-sys = "=0.3.64"
web-sys = "=0.3.64"
serde = "=1.0.188"
solana-program = "=1.18.18"
wasi = "=0.11.0"
serde_json = "=1.0.105"
serde_derive = "=1.0.188"
borsh = "=0.10.3"
zerocopy = "=0.7.32"
hashbrown = "=0.12.3"
indexmap = "=1.9.3"
bitflags = "=1.3.2"
syn = "=2.0.48"
proc-macro2 = "=1.0.78"
quote = "=1.0.35"
spl-token = "=4.0.0"
spl-associated-token-account = "=2.2.0"
spl-token-2022 = "=0.9.0"
toml_edit = "=0.19.8"
toml = "=0.5.11"
proc-macro-crate = "=1.3.1"
shlex = "=1.2.0"
base64 = "=0.13.0"
wit-bindgen = "=0.19.2"
darling = "=0.20.8"
darling_core = "=0.20.8"
darling_macro = "=0.20.8"
thiserror = "=1.0.58"
thiserror-impl = "=1.0.58"
anyhow = "=1.0.81"
libc = "=0.2.153"
semver = "=1.0.22"
bs58 = "=0.5.1"
spdx = "=0.10.6"
toml_parser = "=1.0.0"
