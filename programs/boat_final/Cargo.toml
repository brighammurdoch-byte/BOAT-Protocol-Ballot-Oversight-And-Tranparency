[package]
name = "boat_final"
version = "0.1.0"
description = "BOAT — Ballot Oversight And Transparency (USU campus election MVP)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "boat_final"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["associated_token", "token_2022"] }
