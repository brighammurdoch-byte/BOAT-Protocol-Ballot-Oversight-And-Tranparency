version: '3.8'

services:
  boat-build-stable:
    build:
      context: .
      dockerfile: Dockerfile.stable
    image: boat-protocol-stable:latest
    container_name: boat-build-env-stable
    volumes:
      - .:/workspace
      - cargo-cache:/root/.cargo
      - solana-cache:/root/.config/solana
    working_dir: /workspace
    environment:
      - RUST_BACKTRACE=1
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  cargo-cache:
  solana-cache:
